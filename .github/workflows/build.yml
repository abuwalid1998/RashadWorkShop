name: Build installers

# Produces ready-to-install packages and attaches them to the workflow run
# (Actions tab -> the run -> Artifacts).
on:
  workflow_dispatch:
  push:
    branches: [main, New-Update-by-amjad]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            name: windows
          - os: ubuntu-latest
            script: dist:linux
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: rashad-workshop-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  # Publishes the installers as a GitHub Release named after the version in
  # package.json, so the client downloads one file from the Releases page.
  # Runs once per version: bump "version" to publish the next one.
  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release if this version has none yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
          else
            gh release create "$tag" artifacts/* --target "$GITHUB_SHA" \
              --title "Rashad Workshop $tag" --notes-file docs/INSTALL.md
          fi

  # macOS runners are billed at a higher rate, so the Mac build only runs on request.
  build-mac:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: rashad-workshop-mac
          path: dist/*.dmg
          if-no-files-found: error
